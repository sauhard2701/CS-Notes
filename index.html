<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Markdown-first Computer Science notes for interview preparation.">
  <title>CS Notes</title>
  <link rel="stylesheet" href="node_modules/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app">Loading CS Notes...</div>
  <script>
    window.$docsify = {
      name: 'CS Notes',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      search: {
        paths: 'auto',
        placeholder: 'Search notes',
        noData: 'No results',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      }
    };
  </script>
  <script src="node_modules/docsify/lib/docsify.min.js"></script>
  <script src="node_modules/docsify/lib/plugins/search.min.js"></script>
  <script src="node_modules/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="node_modules/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="node_modules/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
