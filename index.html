<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Markdown-first Computer Science notes for interview preparation.">
  <title>CS Notes</title>
  <link rel="stylesheet" href="site-assets/vendor/docsify-vue.min.css">
</head>
<body>
  <div id="app">Loading CS Notes...</div>
  <script>
    window.$docsify = {
      name: 'CS Notes',
      repo: 'sauhard2701/CS-Notes',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 3,
      routerMode: 'hash',
      search: {
        paths: 'auto',
        placeholder: 'Search notes',
        noData: 'No results',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true
      }
    };
  </script>
  <script src="site-assets/vendor/docsify.min.js"></script>
  <script src="site-assets/vendor/search.min.js"></script>
  <script src="site-assets/vendor/docsify-copy-code.min.js"></script>
  <script src="site-assets/vendor/zoom-image.min.js"></script>
  <script src="site-assets/vendor/docsify-pagination.min.js"></script>
</body>
</html>
